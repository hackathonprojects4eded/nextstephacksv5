[project]
name = "firejams"
version = "0.1.0"
description = "Listen to Spotify together with friends around a cozy campfire"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "eventlet>=0.41.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "python-socketio[client]>=5.17.0",
    "sounddevice>=0.5.6",
    "yt-dlp[default,deno]>=2026.8.19",
]
